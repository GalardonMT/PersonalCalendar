<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Calendario personal para gestionar eventos, plantillas y etiquetas con una interfaz moderna y eficiente.">
    <title>Calendario personal</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="icon" type="image/png" href="logocalendar.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preload" as="style"
        href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap" rel="stylesheet">

    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/index.global.min.js'></script>
    <script src='https://cdn.jsdelivr.net/npm/fullcalendar@6.1.11/locales-all.global.min.js'></script>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- ── Contenedor donde se inyectan los componentes dinámicamente ── -->
    <div id="app-components"></div>

    <!-- ── Shell principal de la aplicación (siempre visible en DOM) ── -->
    <div id="appSection" class="page-shell hidden">
        <header class="topbar">
            <button id="menuToggleBtn" class="menu-toggle-btn" type="button" aria-label="Abrir menú">
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
                <span class="hamburger-bar"></span>
            </button>
            <h1>Mi Calendario</h1>
            <div id="topbarActions" class="topbar-actions">
                <span id="currentUserLabel" class="current-user"></span>
                <button id="openAdminModal" class="btn hidden" type="button">
                    <img src="/icons/admin.png" class="btn-icon" alt="">Admin
                </button>
                <button id="openWhatsappModal" class="btn hidden" type="button">
                    <img id="whatsappIcon" src="/icons/notificacion.png" class="btn-icon" alt="">Notificaciones
                </button>
                <button id="openTemplateModal" class="btn btn-primary" type="button">
                    <img src="/icons/boton-agregar.png" class="btn-icon" alt="">Nuevo evento
                </button>
                <button id="openManageModal" class="btn" type="button">
                    <img src="/icons/config.png" class="btn-icon" alt="">Gestionar eventos
                </button>
                <button id="logoutBtn" class="btn" type="button">
                    <img src="/icons/salida-de-emergencia.png" class="btn-icon" alt="">Salir
                </button>
            </div>
        </header>

        <div class="calendar-layout">
            <aside class="day-panel">
                <div class="day-panel-header">
                    <h2 id="dayPanelTitle">Selecciona un dia</h2>
                    <p id="dayPanelHint">1 clic: seleccionar y ver eventos. 2 clics: abrir modal para agregar.</p>
                </div>

                <div id="dayPanelView" class="day-panel-body">
                    <p class="empty-message">Todavia no has seleccionado una fecha.</p>
                </div>

                <div id="dayPanelEdit" class="day-panel-body hidden"></div>
            </aside>

            <div id="calendar"></div>
        </div>
    </div>

    <!-- ── Toast de notificaciones ── -->
    <div id="toast" class="toast hidden" aria-live="polite"></div>

    <!--
        Orden de carga:
        1. components.js  → carga e inyecta los HTML de cada componente en #app-components
        2. app.js         → escucha 'components:ready' para inicializar la lógica
    -->
    <script src="components.js"></script>
    <script src="app.js"></script>
</body>

</html>
