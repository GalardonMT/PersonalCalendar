<div id="dialogModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="dialogTitle">
    <div class="modal-card dialog-card">
        <div class="modal-header">
            <h2 id="dialogTitle">Confirmacion</h2>
            <button id="dialogCloseBtn" class="icon-btn" type="button" aria-label="Cerrar">x</button>
        </div>
        <div class="modal-body">
            <p id="dialogMessage" class="dialog-message"></p>
            <div class="modal-footer">
                <button id="dialogCancelBtn" class="btn" type="button">Cancelar</button>
                <button id="dialogConfirmBtn" class="btn btn-primary" type="button">Aceptar</button>
            </div>
        </div>
    </div>
</div>
