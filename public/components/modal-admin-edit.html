<!-- Modal separado para editar usuario: se abre solo al hacer click en Editar -->
<div id="adminEditModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="adminEditModalTitle">
    <div class="modal-card admin-modal-card">
        <div class="modal-header">
            <h2 id="adminEditModalTitle">Editar Usuario</h2>
            <button id="adminEditModalCloseBtn" class="icon-btn" type="button" aria-label="Cerrar">x</button>
        </div>
        <form id="adminEditUserForm" class="modal-body admin-edit-form">
            <h3>Editar Usuario</h3>
            <input type="hidden" id="adminEditUserId">
            <label for="adminEditUsername">Nombre de usuario</label>
            <input id="adminEditUsername" type="text" required>
            <label for="adminEditPassword">Nueva contraseña (dejar vacio para no cambiar)</label>
            <input id="adminEditPassword" type="password">
            <div class="modal-footer between">
                <button type="button" class="btn" id="adminCancelEditBtn">Cancelar</button>
                <button type="submit" class="btn btn-primary">Guardar</button>
            </div>
        </form>
    </div>
</div>
