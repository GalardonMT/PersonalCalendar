<div id="viewEventsModal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="viewEventsTitle">
    <div class="modal-card view-events-card">
        <div class="modal-header">
            <h2 id="viewEventsTitle">Ver Eventos</h2>
            <button id="closeViewEventsModal" class="icon-btn" type="button" aria-label="Cerrar">x</button>
        </div>
        <div class="modal-body">
            <label for="eventsFilterSelect">Filtrar por evento base</label>
            <select id="eventsFilterSelect">
                <option value="">Todos los eventos</option>
            </select>
            <div style="display: flex; gap: 10px; margin-bottom: 1rem;">
                <button id="filterUpcomingBtn" class="btn btn-primary" type="button" style="flex: 1;">De hoy en
                    adelante</button>
                <button id="filterAllBtn" class="btn" type="button" style="flex: 1;">Todos los eventos</button>
            </div>

            <div id="eventsPreviewList" class="events-preview-list">
                <p class="empty-message">No hay eventos para mostrar.</p>
            </div>

            <div class="modal-footer">
                <button id="closeViewEventsFooter" class="btn" type="button">Cerrar</button>
            </div>
        </div>
    </div>
</div>
